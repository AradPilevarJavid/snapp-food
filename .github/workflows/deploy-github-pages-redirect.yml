name: Deploy GitHub Pages redirect

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-redirect
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate production destination
        env:
          PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
        run: |
          test -n "$PRODUCTION_WEB_URL" || { echo "::error::Set the PRODUCTION_WEB_URL repository variable to the confirmed HTTPS production URL"; exit 1; }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Generate redirect-only site
        run: python3 web/scripts/generate_pages_redirect.py
        env:
          PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}

      - name: Upload redirect site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/redirect-out

      - name: Deploy redirect site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
