name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_OIDC_AUTHORITY: ${{ vars.NEXT_PUBLIC_OIDC_AUTHORITY }}
      NEXT_PUBLIC_OIDC_CLIENT_ID: ${{ vars.NEXT_PUBLIC_OIDC_CLIENT_ID }}
      NEXT_PUBLIC_OIDC_RESOURCE: ${{ vars.NEXT_PUBLIC_OIDC_RESOURCE }}
      NEXT_PUBLIC_CURRENCY: ${{ vars.NEXT_PUBLIC_CURRENCY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install API contract generation dependencies
        run: python -m pip install -r api/requirements.txt

      - name: Validate required public frontend configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          test -n "$NEXT_PUBLIC_API_BASE_URL" || { echo "::error::Set the NEXT_PUBLIC_API_BASE_URL repository variable"; exit 1; }
          test -n "$NEXT_PUBLIC_OIDC_AUTHORITY" || { echo "::error::Set the NEXT_PUBLIC_OIDC_AUTHORITY repository variable"; exit 1; }
          test -n "$NEXT_PUBLIC_OIDC_CLIENT_ID" || { echo "::error::Set the NEXT_PUBLIC_OIDC_CLIENT_ID repository variable"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set the CLOUDFLARE_ACCOUNT_ID repository variable"; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo "::error::Set the CLOUDFLARE_PAGES_PROJECT repository variable"; exit 1; }

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Generate frontend API contract
        run: npm run api:generate
        working-directory: web

      - name: Build static frontend and security headers
        run: npm run build
        working-directory: web

      - name: Deploy production site
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.168.0
          workingDirectory: web
          command: pages deploy out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=master
